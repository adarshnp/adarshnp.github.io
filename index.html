    <script>
      // Apply the saved theme before first paint to avoid a flash.
      (function () {
        var t = 'dusk'
        try { t = localStorage.getItem('anp-theme') || t } catch (e) {}
        var fx = 'flow'
        try { fx = localStorage.getItem('anp-fx') || fx } catch (e) {}
        if (fx === 'terrain') fx = 'flow'
        var params = new URLSearchParams(location.search)
        if (params.get('theme')) t = params.get('theme')
        if (params.get('fx')) fx = params.get('fx')
        document.documentElement.dataset.theme = t
        document.documentElement.dataset.fx = fx
      })()
    </script>
